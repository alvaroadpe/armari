<!DOCTYPE html>
<html lang="ca" translate="no" class="notranslate">
<head>
  <meta charset="UTF-8" />
  <meta name="google" content="notranslate" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Armari" />
  <meta name="theme-color" content="#F5F5F7" />
  <title>Armari</title>
  <script>
    (function () {
      var c = document.createElement('canvas');
      c.width = 512; c.height = 512;
      var ctx = c.getContext('2d');

      // Background
      ctx.fillStyle = '#F5F5F7';
      ctx.fillRect(0, 0, 512, 512);

      // 1. Hanger (v9 position, drawn behind the t-shirt)
      ctx.strokeStyle = '#0F172A';
      ctx.lineWidth = 14;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      ctx.beginPath();
      ctx.arc(256, 62, 22, Math.PI * 0.9, Math.PI * 2.15);
      ctx.quadraticCurveTo(278, 92, 256, 102);
      ctx.lineTo(256, 126);
      ctx.moveTo(256, 126);
      ctx.lineTo(156, 174);
      ctx.moveTo(256, 126);
      ctx.lineTo(356, 174);
      ctx.stroke();

      // 2. T-shirt on top with solid white fill
      ctx.beginPath();
      ctx.moveTo(202, 166);
      ctx.quadraticCurveTo(256, 202, 310, 166);
      ctx.lineTo(372, 184);
      ctx.lineTo(432, 260);
      ctx.lineTo(380, 290);
      ctx.lineTo(348, 246);
      ctx.lineTo(348, 430);
      ctx.lineTo(164, 430);
      ctx.lineTo(164, 246);
      ctx.lineTo(132, 290);
      ctx.lineTo(80, 260);
      ctx.lineTo(140, 184);
      ctx.closePath();

      ctx.fillStyle = '#FFFFFF';
      ctx.fill();
      ctx.stroke();

      // 3. Horizontal square, triangle, and circle inside
      ctx.lineWidth = 10;
      ctx.strokeRect(194, 288, 30, 30);

      ctx.beginPath();
      ctx.moveTo(256, 287);
      ctx.lineTo(273, 318);
      ctx.lineTo(239, 318);
      ctx.closePath();
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(303, 303, 15, 0, Math.PI * 2);
      ctx.stroke();

      var iconUrl = c.toDataURL('image/png');

      var appleLink = document.createElement('link');
      appleLink.rel = 'apple-touch-icon';
      appleLink.href = iconUrl;
      document.head.appendChild(appleLink);

      var favLink = document.createElement('link');
      favLink.rel = 'icon';
      favLink.type = 'image/png';
      favLink.href = iconUrl;
      document.head.appendChild(favLink);

      var manifestObj = {
        name: 'Armari',
        short_name: 'Armari',
        start_url: location.href,
        display: 'standalone',
        background_color: '#F5F5F7',
        theme_color: '#F5F5F7',
        icons: [{ src: iconUrl, sizes: '512x512', type: 'image/png' }]
      };
      var blob = new Blob([JSON.stringify(manifestObj)], { type: 'application/manifest+json' });
      var manifestLink = document.createElement('link');
      manifestLink.rel = 'manifest';
      manifestLink.href = URL.createObjectURL(blob);
      document.head.appendChild(manifestLink);
    })();
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; box-sizing: border-box; -webkit-touch-callout: none; }
    html, body { margin: 0; padding: 0; height: 100dvh; width: 100vw; overflow: hidden; background: #F5F5F7; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif; color: #1D1D1F; }
    .safe-top { padding-top: max(12px, env(safe-area-inset-top)); }
    .safe-bottom { padding-bottom: max(16px, env(safe-area-inset-bottom)); }
    .outfit-slot { display: flex; align-items: center; justify-content: center; position: relative; touch-action: none; min-width: 140px; }
    .cutout-img { width: auto; display: block; object-fit: contain; filter: drop-shadow(0 8px 14px rgba(0,0,0,0.13)); pointer-events: none; transition: transform 0.25s cubic-bezier(0.22,1,0.36,1); }
    .cutout-top { height: 26dvh; max-height: 26dvh; max-width: 64vw; }
    .cutout-pants { height: 35dvh; max-height: 35dvh; max-width: 58vw; }
    .cutout-shoes { height: 11.5dvh; max-height: 11.5dvh; max-width: 46vw; }
    .cutout-onesie { height: 72dvh; max-height: 72dvh; max-width: 84vw; }
    .checkerboard { background-image: linear-gradient(45deg,#e5e7eb 25%,transparent 25%),linear-gradient(-45deg,#e5e7eb 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#e5e7eb 75%),linear-gradient(-45deg,transparent 75%,#e5e7eb 75%); background-size: 20px 20px; background-position: 0 0,0 10px,10px -10px,-10px 0; }
    .bg-range { -webkit-appearance: none; appearance: none; width: 100%; min-width: 0; height: 28px; background: transparent; cursor: pointer; display: block; }
    .bg-range::-webkit-slider-runnable-track { width: 100%; height: 6px; border-radius: 999px; background: #CBD5E1; }
    .bg-range::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 20px; height: 20px; border-radius: 999px; background: #0F172A; border: 2px solid #FFFFFF; margin-top: -7px; box-shadow: 0 1px 4px rgba(0,0,0,0.3); }
    .bg-range::-moz-range-track { width: 100%; height: 6px; border-radius: 999px; background: #CBD5E1; }
    .bg-range::-moz-range-thumb { width: 20px; height: 20px; border-radius: 999px; background: #0F172A; border: 2px solid #FFFFFF; box-shadow: 0 1px 4px rgba(0,0,0,0.3); }
  </style>
</head>
<body translate="no" class="notranslate flex flex-col justify-between h-[100dvh] w-screen overflow-hidden">

  <!-- Configuració / Edició de dies de bugada -->
  <div id="laundrySetupOverlay" class="hidden fixed inset-0 bg-[#F5F5F7] z-[80] flex flex-col items-center justify-center px-6 text-center">
    <div class="w-full max-w-xs flex flex-col gap-5 relative">
      <button type="button" id="cancelLaundryDaysBtn" aria-label="Tancar" class="hidden self-end w-8 h-8 rounded-full bg-white border border-slate-200 text-slate-600 font-bold shadow-sm">&times;</button>
      <div class="flex flex-col gap-1.5">
        <h1 id="laundrySetupTitle" class="text-2xl font-bold tracking-tight text-slate-900">Benvinguda!</h1>
        <p class="text-sm text-slate-500">Quin dia o dies acostuma a estar llesta la bugada?</p>
      </div>
      <div class="grid grid-cols-2 gap-2.5 text-left">
        <button type="button" data-day="1" class="day-setup-btn py-3 px-4 rounded-2xl bg-white border border-slate-200 text-sm font-semibold text-slate-700 transition">Dilluns</button>
        <button type="button" data-day="2" class="day-setup-btn py-3 px-4 rounded-2xl bg-white border border-slate-200 text-sm font-semibold text-slate-700 transition">Dimarts</button>
        <button type="button" data-day="3" class="day-setup-btn py-3 px-4 rounded-2xl bg-white border border-slate-200 text-sm font-semibold text-slate-700 transition">Dimecres</button>
        <button type="button" data-day="4" class="day-setup-btn py-3 px-4 rounded-2xl bg-white border border-slate-200 text-sm font-semibold text-slate-700 transition">Dijous</button>
        <button type="button" data-day="5" class="day-setup-btn py-3 px-4 rounded-2xl bg-white border border-slate-200 text-sm font-semibold text-slate-700 transition">Divendres</button>
        <button type="button" data-day="6" class="day-setup-btn py-3 px-4 rounded-2xl bg-white border border-slate-200 text-sm font-semibold text-slate-700 transition">Dissabte</button>
        <button type="button" data-day="0" class="day-setup-btn col-span-2 py-3 px-4 rounded-2xl bg-white border border-slate-200 text-sm font-semibold text-slate-700 text-center transition">Diumenge</button>
      </div>
      <button type="button" id="saveLaundryDaysBtn" disabled class="w-full py-3.5 rounded-2xl bg-sky-600 text-white text-sm font-semibold disabled:opacity-35 shadow-sm transition">
        Continuar
      </button>
    </div>
  </div>

  <!-- Pregunta inicial del dia -->
  <div id="welcomeOverlay" class="fixed inset-0 bg-[#F5F5F7] z-50 flex flex-col items-center justify-center px-6 text-center transition-opacity duration-300">
    <div class="w-full max-w-xs flex flex-col gap-6">
      <div class="flex flex-col gap-1.5">
        <h1 class="text-2xl font-bold tracking-tight text-slate-900">Bon die!</h1>
        <p class="text-sm text-slate-500">Quin tipus de dia tens avui?</p>
      </div>
      <div class="flex flex-col gap-3">
        <button type="button" data-pick="casual" class="welcome-pick-btn w-full py-4 rounded-2xl bg-white text-slate-900 font-semibold text-base shadow-sm border border-black/5 active:scale-95 transition">
          Informal
        </button>
        <button type="button" data-pick="semiformal" class="welcome-pick-btn w-full py-4 rounded-2xl bg-white text-slate-900 font-semibold text-base shadow-sm border border-black/5 active:scale-95 transition">
          Semiformal
        </button>
        <button type="button" data-pick="formal" class="welcome-pick-btn w-full py-4 rounded-2xl bg-white text-slate-900 font-semibold text-base shadow-sm border border-black/5 active:scale-95 transition">
          Formal
        </button>
      </div>
    </div>
  </div>

  <!-- Recordatori de bugada -->
  <div id="laundryReminderModal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm z-[55] flex items-center justify-center p-5">
    <div class="bg-white w-full max-w-xs rounded-3xl p-6 shadow-2xl flex flex-col gap-4 text-center">
      <div class="w-12 h-12 rounded-full bg-sky-100 text-sky-600 mx-auto flex items-center justify-center">
        <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="2" width="18" height="20" rx="3"/><line x1="3" y1="7" x2="21" y2="7"/><circle cx="12" cy="14" r="4.5"/>
        </svg>
      </div>
      <div class="flex flex-col gap-1">
        <h2 class="text-lg font-bold text-slate-900">Ja està feta la bugada?</h2>
        <p class="text-xs text-slate-500">Ha passat el dia de bugada i tens roba pendent de rentar.</p>
      </div>
      <div class="flex flex-col gap-2 pt-1">
        <button type="button" id="confirmLaundryDoneBtn" class="w-full py-3 rounded-2xl bg-sky-600 text-white text-sm font-semibold active:scale-98 transition">
          Sí, refrescar la roba
        </button>
        <button type="button" id="dismissLaundryReminderBtn" class="w-full py-2.5 rounded-2xl bg-slate-100 text-slate-600 text-xs font-semibold active:scale-98 transition">
          Encara no
        </button>
      </div>
    </div>
  </div>

  <!-- Barra superior -->
  <header class="safe-top px-4 pb-1 flex items-center justify-between gap-2 z-10">
    <div id="formalityBar" class="flex bg-black/5 p-1 rounded-full flex-1 max-w-[270px]">
      <button type="button" data-formality="casual" class="formality-btn flex-1 py-1.5 text-xs font-semibold rounded-full transition-all">Informal</button>
      <button type="button" data-formality="semiformal" class="formality-btn flex-1 py-1.5 text-xs font-semibold rounded-full transition-all">Semiformal</button>
      <button type="button" data-formality="formal" class="formality-btn flex-1 py-1.5 text-xs font-semibold rounded-full transition-all">Formal</button>
    </div>

    <div class="flex items-center gap-2">
      <!-- Rentadora -->
      <button type="button" id="laundryBtn" aria-label="Rentadora" class="relative w-10 h-10 rounded-full bg-white shadow-sm flex items-center justify-center active:scale-95 transition">
        <svg class="w-5 h-5 text-slate-700" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="2" width="18" height="20" rx="3"/><line x1="3" y1="7" x2="21" y2="7"/><circle cx="7" cy="4.5" r="0.8" fill="currentColor"/><circle cx="10" cy="4.5" r="0.8" fill="currentColor"/><circle cx="12" cy="14" r="4.5"/><path d="M9.5 14c1.2-1 2.3-1 3.5 0s2.3 1 3.5 0"/>
        </svg>
        <span id="laundryBadge" class="hidden absolute -top-1 -right-1 min-w-[18px] h-[18px] px-1 rounded-full bg-rose-500 text-white text-[10px] font-bold flex items-center justify-center">0</span>
      </button>

      <!-- Armari -->
      <button type="button" id="closetBtn" aria-label="Armari" class="w-10 h-10 rounded-full bg-white shadow-sm flex items-center justify-center active:scale-95 transition">
        <svg class="w-5 h-5 text-slate-700" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20.38 3.46L16 2a4 4 0 01-8 0L3.62 3.46a2 2 0 00-1.34 2.23l.58 3.47a1 1 0 00.99.84H6v10c0 1.1.9 2 2 2h8a2 2 0 002-2V10h2.15a1 1 0 00.99-.84l.58-3.47a2 2 0 00-1.34-2.23z"/>
        </svg>
      </button>
    </div>
  </header>

  <input type="file" id="fileInput" accept="image/*" multiple class="hidden" />

  <!-- Peces de roba tocant-se i proporcionades + Easter egg 1% -->
  <main class="flex-1 flex flex-col items-center justify-center px-4 overflow-hidden relative">
    <div id="outfitStack" class="flex flex-col items-center justify-center w-full">
      <div id="slot-top" data-category="top" class="outfit-slot z-30"><div class="slot-content flex items-center justify-center"></div></div>
      <div id="slot-pants" data-category="pants" class="outfit-slot z-20 -mt-2"><div class="slot-content flex items-center justify-center"></div></div>
      <div id="slot-shoes" data-category="shoes" class="outfit-slot z-10 -mt-1.5"><div class="slot-content flex items-center justify-center"></div></div>
    </div>

    <!-- Conjunt sencer sorpresa (1% de probabilitat) -->
    <div id="easterEggSlot" class="hidden flex-1 w-full flex items-center justify-center cursor-pointer">
      <img src="./duck-onesie.png" alt="" class="cutout-img cutout-onesie" />
    </div>

    <!-- Avís inferior -->
    <div id="toastMsg" class="pointer-events-none opacity-0 transition-opacity duration-300 fixed bottom-24 left-1/2 -translate-x-1/2 bg-slate-900/90 text-white text-xs font-medium px-4 py-2 rounded-full shadow-lg z-40 whitespace-nowrap"></div>
  </main>

  <!-- Barra inferior -->
  <footer class="safe-bottom px-6 pt-1 flex flex-col items-center z-10">
    <button type="button" id="shuffleBtn" class="w-full max-w-xs py-3 rounded-full bg-white text-slate-900 font-semibold text-sm shadow-sm border border-black/5 active:scale-95 transition flex items-center justify-center gap-2">
      Canviar conjunt
    </button>
  </footer>

  <!-- Finestra gran d'etiquetatge / edició de retall -->
  <div id="taggingModal" class="hidden fixed inset-0 bg-black/55 backdrop-blur-sm z-[75] flex items-center justify-center p-2 sm:p-4">
    <div class="bg-white w-full max-w-2xl h-[95dvh] max-h-[95dvh] rounded-3xl p-4 sm:p-6 shadow-2xl flex flex-col gap-3 overflow-hidden">
      <div class="flex items-center justify-between shrink-0">
        <span id="tagProgressText" class="text-xs font-bold uppercase tracking-wider text-slate-400">Foto 1 de 1</span>
        <div class="flex items-center gap-3">
          <button type="button" id="skipPhotoBtn" class="text-xs font-semibold text-slate-500">Ometre</button>
          <button type="button" id="cancelQueueBtn" class="text-xs font-semibold text-rose-500">Cancel·lar tot</button>
        </div>
      </div>

      <div id="tagProgressTrack" class="w-full h-1.5 bg-slate-100 rounded-full overflow-hidden shrink-0">
        <div id="tagProgressBar" class="h-full bg-slate-900 transition-all duration-300" style="width:100%"></div>
      </div>

      <!-- Previsualització ampla amb slider a sobre -->
      <div class="relative flex-1 min-h-[240px] w-full rounded-2xl checkerboard flex flex-col overflow-hidden border border-slate-200">
        <div class="z-10 mx-3 mt-3 px-3 py-1.5 rounded-xl bg-white/95 backdrop-blur shadow-sm border border-slate-200/80 flex items-center gap-2.5 shrink-0">
          <span class="text-[11px] font-bold text-slate-600 shrink-0">Fons</span>
          <input type="range" id="toleranceSlider" min="0" max="125" value="48" class="bg-range flex-1" />
          <span id="toleranceValueText" class="text-[11px] font-bold text-slate-800 w-7 text-right shrink-0">48</span>
        </div>

        <div class="relative flex-1 w-full min-h-0 flex items-center justify-center p-3 touch-none">
          <canvas id="tagEditorCanvas" class="w-full h-full object-contain drop-shadow-md cursor-crosshair"></canvas>
          <div id="bgRemoveBadge" class="hidden absolute bottom-2 right-2 bg-slate-900/85 text-white text-[11px] px-2.5 py-1 rounded-full">Processant...</div>
        </div>
      </div>

      <!-- Modes Esborrar / Restaurar -->
      <div class="flex items-center justify-between gap-2 bg-slate-50 rounded-2xl px-2.5 py-1.5 border border-slate-200/80 shrink-0">
        <div class="flex bg-slate-200/80 p-0.5 rounded-xl">
          <button type="button" id="toolEraseBtn" class="px-2.5 py-1 rounded-lg text-[11px] font-semibold bg-white text-slate-900 shadow-sm transition">Toca per esborrar</button>
          <button type="button" id="toolRestoreBtn" class="px-2.5 py-1 rounded-lg text-[11px] font-semibold text-slate-600 transition">Restaurar</button>
        </div>
        <button type="button" id="resetCutoutBtn" class="text-[11px] font-semibold text-sky-600 px-2 py-1 active:opacity-70">Reiniciar</button>
      </div>

      <div class="flex flex-col gap-1 shrink-0">
        <label class="text-xs font-bold text-slate-700">Quina peça de roba és?</label>
        <div class="grid grid-cols-3 gap-2">
          <button type="button" data-cat="top" class="tag-cat-btn py-2.5 rounded-xl border border-slate-200 text-xs font-semibold text-slate-700">Samarreta</button>
          <button type="button" data-cat="pants" class="tag-cat-btn py-2.5 rounded-xl border border-slate-200 text-xs font-semibold text-slate-700">Pantalons</button>
          <button type="button" data-cat="shoes" class="tag-cat-btn py-2.5 rounded-xl border border-slate-200 text-xs font-semibold text-slate-700">Sabates</button>
        </div>
      </div>

      <div class="flex flex-col gap-1 shrink-0">
        <label class="text-xs font-bold text-slate-700">Com és de formal?</label>
        <div class="grid grid-cols-3 gap-2">
          <button type="button" data-form="casual" class="tag-form-btn py-2.5 rounded-xl border border-slate-200 text-xs font-semibold text-slate-700">Informal</button>
          <button type="button" data-form="semiformal" class="tag-form-btn py-2.5 rounded-xl border border-slate-200 text-xs font-semibold text-slate-700">Semiformal</button>
          <button type="button" data-form="formal" class="tag-form-btn py-2.5 rounded-xl border border-slate-200 text-xs font-semibold text-slate-700">Formal</button>
        </div>
      </div>

      <button type="button" id="saveTagBtn" disabled class="w-full py-3.5 rounded-2xl bg-slate-900 text-white text-sm font-semibold disabled:opacity-35 shrink-0">Desar i següent</button>
    </div>
  </div>

  <!-- Rentadora amb icona discreta de calendari per configurar els dies de bugada -->
  <div id="laundryModal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-3">
    <div class="bg-white w-full max-w-md rounded-3xl p-5 shadow-2xl flex flex-col gap-4 max-h-[85dvh]">
      <div class="flex items-center justify-between gap-2">
        <div class="flex items-center gap-2 min-w-0">
          <h2 id="laundryTitle" class="text-base font-bold text-slate-900 truncate">Rentadora</h2>
          <button type="button" id="editLaundryDaysBtn" aria-label="Dies de bugada" title="Dies de bugada" class="w-7 h-7 rounded-full bg-slate-100 text-slate-500 flex items-center justify-center shrink-0 active:scale-95 transition">
            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
            </svg>
          </button>
        </div>
        <div class="flex items-center gap-1.5 shrink-0">
          <button type="button" id="selectAllLaundryBtn" class="hidden h-8 px-3 rounded-full bg-white text-slate-900 border border-slate-200 shadow-sm text-xs font-semibold active:scale-95 transition">Tot</button>
          <button type="button" id="cancelLaundrySelectBtn" class="hidden h-8 px-3 rounded-full bg-slate-100 text-slate-700 text-xs font-semibold active:scale-95 transition">Desmarcar</button>
          <button type="button" id="closeLaundryBtn" class="w-8 h-8 rounded-full bg-slate-100 text-slate-600 font-bold">&times;</button>
        </div>
      </div>
      <div id="laundryGrid" class="flex-1 overflow-y-auto grid grid-cols-3 gap-3 min-h-[120px] p-1"></div>
      <div id="laundryNormalFooter">
        <button type="button" id="washAllBtn" class="w-full py-3.5 rounded-2xl bg-sky-600 text-white text-sm font-semibold disabled:opacity-40">Rentar-ho tot (Posar rentadora)</button>
      </div>
      <div id="laundryMultiFooter" class="hidden grid grid-cols-2 gap-2.5 pt-1">
        <button type="button" id="laundryViewSelectedBtn" class="py-3 rounded-2xl bg-white text-slate-900 border border-slate-200 shadow-sm text-xs font-semibold active:scale-95 transition">Veure</button>
        <button type="button" id="washSelectedBtn" class="py-3 rounded-2xl bg-sky-600 text-white text-xs font-semibold active:scale-95 transition">Treure (Netes)</button>
      </div>
    </div>
  </div>

  <!-- Armari amb filtres de categoria -->
  <div id="closetModal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-3">
    <div class="bg-white w-full max-w-md rounded-3xl p-5 shadow-2xl flex flex-col gap-3 max-h-[86dvh]">
      <div class="flex items-center justify-between gap-2">
        <h2 id="closetTitle" class="text-base font-bold text-slate-900 truncate">Armari</h2>
        <div class="flex items-center gap-1.5 shrink-0">
          <button type="button" id="addInsideClosetBtn" class="h-8 px-3 rounded-full bg-slate-900 text-white text-xs font-semibold flex items-center gap-1 active:scale-95 transition">

    function openDB() {
      return new Promise(function (resolve, reject) {
        if (!window.indexedDB) return reject(new Error('Sense IndexedDB'));
        var req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = function (e) {
          var d = e.target.result;
          if (!d.objectStoreNames.contains(STORE_NAME)) d.createObjectStore(STORE_NAME, { keyPath: 'id' });
        };
        req.onsuccess = function (e) { db = e.target.result; resolve(db); };
        req.onerror = function (e) { reject(e.target.error); };
      });
    }

    function getAllItems() {
      return openDB().then(function () {
        return new Promise(function (resolve, reject) {
          var req = db.transaction(STORE_NAME, 'readonly').objectStore(STORE_NAME).getAll();
          req.onsuccess = function () { resolve(req.result || []); };
          req.onerror = function () { reject(req.error); };
        });
      });
    }

    function putItem(item) {
      return openDB().then(function () {
        return new Promise(function (resolve, reject) {
          var tx = db.transaction(STORE_NAME, 'readwrite');
          tx.objectStore(STORE_NAME).put(item);
          tx.oncomplete = function () { resolve(); };
          tx.onerror = function () { reject(tx.error); };
        });
      });
    }

    function deleteItemFromDB(id) {
      return openDB().then(function () {
        return new Promise(function (resolve, reject) {
          var tx = db.transaction(STORE_NAME, 'readwrite');

          tx.oncomplete = function () { resolve(); };
          tx.onerror = function () { reject(tx.error); };

    function checkLaundrySchedule() {
      var rawDays = localStorage.getItem(STORAGE_LAUNDRY_DAYS);
      if (!rawDays) {
        openLaundryDaysEditor(true);
        return;
      }

      var laundryDays = JSON.parse(rawDays);
      var todayStr = getTodayDateString();
      var lastCheckStr = localStorage.getItem(STORAGE_LAST_CHECK);

      if (!lastCheckStr) {
        localStorage.setItem(STORAGE_LAST_CHECK, todayStr);
        return;
      }

      if (lastCheckStr === todayStr) return;

      var start = new Date(lastCheckStr + 'T00:00:00');
      var end = new Date(todayStr + 'T00:00:00');
      var laundryDayPassed = false;
      var cursor = new Date(start.getTime() + 86400000);

      while (cursor <= end) {
        if (laundryDays.indexOf(cursor.getDay()) !== -1) {
          laundryDayPassed = true;
          break;
        }
        cursor = new Date(cursor.getTime() + 86400000);
      }

      var hasDirtyClothes = wardrobe.some(function (i) { return !i.isStarter && i.dirty; });
      if (laundryDayPassed && hasDirtyClothes) {
        document.getElementById('laundryReminderModal').classList.remove('hidden');
      } else {
        localStorage.setItem(STORAGE_LAST_CHECK, todayStr);
      }

    // --- INTERACTIVE CUTOUT ENGINE (SLIDER + TAP-TO-ERASE + RESTORE BRUSH) ---
    function loadImageFromDataUrl(dataUrl, preserveExistingAlpha) {
      return new Promise(function (resolve) {
        var img = new Image();
        img.onload = function () {
          var sc = Math.min(1, 520 / Math.max(img.width, img.height));
          var w = Math.max(1, Math.round(img.width * sc));
          var h = Math.max(1, Math.round(img.height * sc));
          var c = document.createElement('canvas');
          c.width = w; c.height = h;
          var ctx = c.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          var origData = ctx.getImageData(0, 0, w, h);
          var px = origData.data;

          var initialMask = new Uint8Array(w * h);
          var hasTransparent = false;
          for (var i = 0, p = 0; i < initialMask.length; i++, p += 4) {
            if (preserveExistingAlpha && px[p + 3] <= 20) {
              initialMask[i] = 0;
              hasTransparent = true;
            } else {
              initialMask[i] = 1;
            }
          }

          var storedRaw = preserveExistingAlpha ? dataUrl : c.toDataURL('image/jpeg', 0.85);
          resolve({
            w: w,
            h: h,
            origPixels: px,
            rawDataUrl: storedRaw,
            preserveExistingAlpha: preserveExistingAlpha && hasTransparent,
            initialMask: initialMask,
            mask: new Uint8Array(initialMask)
          });
        };
        img.onerror = function () { resolve(null); };
        img.src = dataUrl;
      });
    }

    function loadImageForEntry(file) {
      return new Promise(function (resolve) {
        var reader = new FileReader();
        reader.onload = function () {
          loadImageFromDataUrl(reader.result, false).then(resolve);
        };
        reader.onerror = function () { resolve(null); };
        reader.readAsDataURL(file);
      });
    }

    function recomputeMaskFromTolerance(entry) {
      if (!entry || !entry.base) return;
      var w = entry.base.w, h = entry.base.h, d = entry.base.origPixels;
      var mask = entry.base.mask;
      var tol = entry.tolerance;

      if (entry.base.preserveExistingAlpha) {
        mask.set(entry.base.initialMask);
      } else {
        mask.fill(1);
      }

      if (tol > 0) {
        var patch = Math.min(5, w, h);
        var corners = [
          [0, 0],
          [w - patch, 0],
          [0, h - patch],
          [w - patch, h - patch]
        ];
        var r = 0, g = 0, b = 0, count = 0;
        for (var c = 0; c < corners.length; c++) {
          var cx = corners[c][0], cy = corners[c][1];
          for (var dy = 0; dy < patch; dy++) {
            for (var dx = 0; dx < patch; dx++) {
              var pIdx = ((cy + dy) * w + (cx + dx)) * 4;
              if (d[pIdx + 3] > 20) {
                r += d[pIdx];
                g += d[pIdx + 1];
                b += d[pIdx + 2];
                count++;
              }
            }
          }
        }
        if (count > 0) {
          r /= count; g /= count; b /= count;
          var vis = new Uint8Array(w * h);
          var stack = [];
          for (var sx = 0; sx < w; sx++) { stack.push(sx); stack.push((h - 1) * w + sx); }
          for (var sy = 0; sy < h; sy++) { stack.push(sy * w); stack.push(sy * w + (w - 1)); }

          while (stack.length > 0) {
            var pos = stack.pop();
            if (vis[pos]) continue;
            vis[pos] = 1;
            var idx = pos * 4;
            if (d[idx + 3] > 20) {
              var dist = Math.sqrt(Math.pow(d[idx] - r, 2) + Math.pow(d[idx + 1] - g, 2) + Math.pow(d[idx + 2] - b, 2));
              if (dist > tol) continue;
            }
            mask[pos] = 0;
            var px = pos % w, py = (pos - px) / w;
            if (px > 0) stack.push(pos - 1);
            if (px < w - 1) stack.push(pos + 1);
            if (py > 0) stack.push(pos - w);
            if (py < h - 1) stack.push(pos + w);
          }
        }
      }

      if (entry.manualEraseSeeds) {
        entry.manualEraseSeeds.forEach(function (seed) {
          floodEraseAt(entry, seed.x, seed.y, false);
        });
      }
      if (entry.manualRestorePoints) {
        entry.manualRestorePoints.forEach(function (pt) {
          paintRestoreAt(entry, pt.x, pt.y, false);
        });
      }
    }

    function floodEraseAt(entry, startX, startY, recordSeed) {
      if (!entry || !entry.base) return;
      var w = entry.base.w, h = entry.base.h, d = entry.base.origPixels, mask = entry.base.mask;
      var x0 = Math.max(0, Math.min(w - 1, Math.round(startX)));
      var y0 = Math.max(0, Math.min(h - 1, Math.round(startY)));
      var seedPos = y0 * w + x0;
      var sIdx = seedPos * 4;
      var sr = d[sIdx], sg = d[sIdx + 1], sb = d[sIdx + 2];
      var tol = Math.max(24, entry.tolerance * 0.85);

      if (recordSeed) {
        entry.manualEraseSeeds.push({ x: x0, y: y0 });
      }

      var vis = new Uint8Array(w * h);
      var stack = [seedPos];
      while (stack.length > 0) {
        var pos = stack.pop();
        if (vis[pos]) continue;
        vis[pos] = 1;
        var idx = pos * 4;
        var dist = Math.sqrt(Math.pow(d[idx] - sr, 2) + Math.pow(d[idx + 1] - sg, 2) + Math.pow(d[idx + 2] - sb, 2));
        if (dist > tol) continue;
        mask[pos] = 0;
        var px = pos % w, py = (pos - px) / w;
        if (px > 0) stack.push(pos - 1);
        if (px < w - 1) stack.push(pos + 1);
        if (py > 0) stack.push(pos - w);
        if (py < h - 1) stack.push(pos + w);
      }
    }

    function paintRestoreAt(entry, cx, cy, recordPoint) {
      if (!entry || !entry.base) return;
      var w = entry.base.w, h = entry.base.h, mask = entry.base.mask;
      var radius = Math.max(12, Math.round(Math.min(w, h) * 0.045));
      var r2 = radius * radius;
      var x0 = Math.round(cx), y0 = Math.round(cy);

      if (recordPoint) {
        entry.manualRestorePoints.push({ x: x0, y: y0 });
      }

      var minX = Math.max(0, x0 - radius), maxX = Math.min(w - 1, x0 + radius);
      var minY = Math.max(0, y0 - radius), maxY = Math.min(h - 1, y0 + radius);
      for (var y = minY; y <= maxY; y++) {
        for (var x = minX; x <= maxX; x++) {
          var dx = x - x0, dy = y - y0;
          if (dx * dx + dy * dy <= r2) {
            mask[y * w + x] = 1;
          }
        }
      }
    }

    function paintRestoreLine(entry, x1, y1, x2, y2) {
      var dist = Math.hypot(x2 - x1, y2 - y1);
      var steps = Math.max(1, Math.ceil(dist / 4));
      for (var s = 0; s <= steps; s++) {
        var t = s / steps;
        paintRestoreAt(entry, x1 + (x2 - x1) * t, y1 + (y2 - y1) * t, true);
      }
    }

    function renderEntryToEditorCanvas(entry) {
      var canvas = document.getElementById('tagEditorCanvas');
      if (!entry || !entry.base) return;
      var w = entry.base.w, h = entry.base.h;
      canvas.width = w;
      canvas.height = h;
      var ctx = canvas.getContext('2d');
      var outImg = ctx.createImageData(w, h);
      var src = entry.base.origPixels;
      var dst = outImg.data;
      var mask = entry.base.mask;
      for (var i = 0, p = 0; i < mask.length; i++, p += 4) {
        dst[p] = src[p];
        dst[p + 1] = src[p + 1];
        dst[p + 2] = src[p + 2];
        dst[p + 3] = mask[i] ? (src[p + 3] > 20 ? src[p + 3] : 255) : 0;
      }
      ctx.putImageData(outImg, 0, 0);
    }

    function exportCroppedCutoutDataUrl(entry) {
      if (!entry || !entry.base) return '';
      var w = entry.base.w, h = entry.base.h, src = entry.base.origPixels, mask = entry.base.mask;
      var tmp = document.createElement('canvas');
      tmp.width = w; tmp.height = h;
      var tctx = tmp.getContext('2d');
      var imgData = tctx.createImageData(w, h);
      var dst = imgData.data;

      var minX = w, minY = h, maxX = 0, maxY = 0, hasOpaque = false;
      for (var y = 0; y < h; y++) {
        for (var x = 0; x < w; x++) {
          var pos = y * w + x;
          var p = pos * 4;
          var alpha = mask[pos] ? (src[p + 3] > 20 ? src[p + 3] : 255) : 0;
          dst[p] = src[p];
          dst[p + 1] = src[p + 1];
          dst[p + 2] = src[p + 2];
          dst[p + 3] = alpha;
          if (alpha > 20) {
            hasOpaque = true;
            if (x < minX) minX = x;
            if (x > maxX) maxX = x;
            if (y < minY) minY = y;
            if (y > maxY) maxY = y;
          }
        }
      }
      tctx.putImageData(imgData, 0, 0);

      if (!hasOpaque) {
        return entry.base.rawDataUrl || tmp.toDataURL('image/png');
      }

      var cw = Math.max(1, maxX - minX + 1);
      var ch = Math.max(1, maxY - minY + 1);
      var sc = Math.min(1, 560 / Math.max(cw, ch));
      var outW = Math.max(1, Math.round(cw * sc));
      var outH = Math.max(1, Math.round(ch * sc));

      var out = document.createElement('canvas');
      out.width = outW;
      out.height = outH;
      var octx = out.getContext('2d');
      octx.drawImage(tmp, minX, minY, cw, ch, 0, 0, outW, outH);
      return out.toDataURL('image/png');
    }

    var toastTimer = null;
    function showToast(msg) {
      var el = document.getElementById('toastMsg');
      el.textContent = msg || 'Enviat a la rentadora';

    function getCleanItemsFor(cat) {
      var real = wardrobe.filter(function (i) { return !i.isStarter && !i.dirty && i.category === cat && i.formalities.indexOf(currentFormality) !== -1; });
      if (real.length > 0) return real;
      var hasReal = wardrobe.some(function (i) { return !i.isStarter && i.category === cat; });
      if (hasReal) return [];
      return wardrobe.filter(function (i) { return i.isStarter && i.category === cat && i.formalities.indexOf(currentFormality) !== -1; });
    }

    var LOCK_ICON_HTML = '<span class="absolute top-1 right-1 w-6 h-6 rounded-full bg-slate-900/85 text-white shadow-md flex items-center justify-center pointer-events-none"><svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>';

    function renderAll() {
      document.querySelectorAll('.formality-btn').forEach(function (btn) {
        var active = btn.dataset.formality === currentFormality;
        btn.classList.toggle('bg-white', active);
        btn.classList.toggle('text-slate-900', active);
        btn.classList.toggle('shadow-sm', active);
        btn.classList.toggle('text-slate-500', !active);
      });

      var stackEl = document.getElementById('outfitStack');
      var eggEl = document.getElementById('easterEggSlot');

      if (duckEasterEggActive) {
        stackEl.classList.add('hidden');
        eggEl.classList.remove('hidden');
      } else {
        eggEl.classList.add('hidden');
        stackEl.classList.remove('hidden');

        ['top', 'pants', 'shoes'].forEach(function (cat) {
          var box = document.getElementById('slot-' + cat).querySelector('.slot-content');
          var list = getCleanItemsFor(cat);
          if (list.length === 0) {
            lockedSlots[cat] = false;
            box.innerHTML = '<div class="w-28 h-28 my-1 px-3 rounded-full border-2 border-dashed border-slate-300 flex items-center justify-center text-center text-slate-400 text-xs font-medium leading-tight">' + EMPTY_LABELS[cat] + '</div>';
            return;
          }
          if (currentIndices[cat] >= list.length) currentIndices[cat] = 0;
          var lockBadge = lockedSlots[cat] ? LOCK_ICON_HTML : '';
          box.innerHTML = '<div class="relative inline-flex items-center justify-center"><img src="' + list[currentIndices[cat]].image + '" alt="" class="cutout-img cutout-' + cat + '" />' + lockBadge + '</div>';
        });
      }

      var dirtyCount = wardrobe.filter(function (i) { return !i.isStarter && i.dirty; }).length;
      var badge = document.getElementById('laundryBadge');
      badge.textContent = String(dirtyCount);
      badge.classList.toggle('hidden', dirtyCount === 0);
    }

    function nextItem(cat) {
      if (lockedSlots[cat]) {
        showToast('Bloquejat · Llisca a l\'esquerra per desbloquejar');
        return;
      }
      var list = getCleanItemsFor(cat);
      if (list.length <= 1) return;

      if (Math.random() < 0.01) {
        duckEasterEggActive = true;
        renderAll();
        return;
      }

      duckEasterEggActive = false;
      currentIndices[cat] = (currentIndices[cat] + 1) % list.length;
      renderAll();
    }

    function setSlotLock(cat, shouldLock) {
      var list = getCleanItemsFor(cat);
      if (!list.length) return;
      if (lockedSlots[cat] === shouldLock) {
        showToast(shouldLock ? 'Ja està bloquejada' : 'Ja està desbloquejada');
        return;
      }
      lockedSlots[cat] = shouldLock;
      showToast(shouldLock ? 'Peça bloquejada' : 'Peça desbloquejada');
      renderAll();
    }

    function sendToLaundry(cat) {
      var list = getCleanItemsFor(cat);
      if (!list.length) return;
      var item = list[currentIndices[cat]];
      if (item.isStarter) return;
      lockedSlots[cat] = false;
      item.dirty = true;
      putItem(item).then(function () { showToast('Enviat a la rentadora'); renderAll(); });
    }

    function attachSwipe(cat) {
      var el = document.getElementById('slot-' + cat);
      var sx = 0, sy = 0, dx = 0, dy = 0, down = false;
      el.addEventListener('pointerdown', function (e) {
        sx = e.clientX;
        sy = e.clientY;
        dx = 0;
        dy = 0;
        down = true;
        el.setPointerCapture(e.pointerId);
      });
      el.addEventListener('pointermove', function (e) {
        if (!down) return;
        dx = e.clientX - sx;
        dy = e.clientY - sy;
        var img = el.querySelector('.cutout-img');
        if (!img) return;
        img.style.transition = 'none';
        if (dy < 0 && Math.abs(dy) > Math.abs(dx)) {
          var scale = Math.max(0.85, 1 + dy * 0.0008);
          img.style.transform = 'translateY(' + dy + 'px) scale(' + scale + ')';
        } else {
          img.style.transform = 'translateX(' + dx + 'px) rotate(' + (dx * 0.05) + 'deg)';
        }
      });
      function finish() {
        if (!down) return;
        down = false;
        var img = el.querySelector('.cutout-img');
        if (img) {
          img.style.transition = 'transform 0.25s ease';
          img.style.transform = 'translate(0, 0) rotate(0) scale(1)';
        }
        if (Math.abs(dx) < 12 && Math.abs(dy) < 12) {
          nextItem(cat);
        } else if (dy < -55 && Math.abs(dy) > Math.abs(dx)) {
          sendToLaundry(cat);
        } else if (dx > 50 && Math.abs(dx) >= Math.abs(dy)) {
          setSlotLock(cat, true);
        } else if (dx < -50 && Math.abs(dx) >= Math.abs(dy)) {
          setSlotLock(cat, false);
        }
      }
      el.addEventListener('pointerup', finish);
      el.addEventListener('pointercancel', finish);
    }

    document.getElementById('easterEggSlot').addEventListener('click', function () {
      duckEasterEggActive = false;
      renderAll();
    });

    function updateEditorToolUI() {
      var eraseBtn = document.getElementById('toolEraseBtn');
      var restoreBtn = document.getElementById('toolRestoreBtn');
      var isErase = editorToolMode === 'erase';

      eraseBtn.classList.toggle('bg-white', isErase);
      eraseBtn.classList.toggle('text-slate-900', isErase);
      eraseBtn.classList.toggle('shadow-sm', isErase);
      eraseBtn.classList.toggle('text-slate-600', !isErase);

      restoreBtn.classList.toggle('bg-white', !isErase);
      restoreBtn.classList.toggle('text-slate-900', !isErase);
      restoreBtn.classList.toggle('shadow-sm', !isErase);
      restoreBtn.classList.toggle('text-slate-600', isErase);
    }

    document.getElementById('toolEraseBtn').addEventListener('click', function () {

    document.getElementById('toleranceSlider').addEventListener('input', function (e) {
      var cur = taggingQueue[queueIndex];
      if (!cur || !cur.base) return;

    document.getElementById('resetCutoutBtn').addEventListener('click', function () {
      var cur = taggingQueue[queueIndex];
      if (!cur || !cur.base) return;
      cur.tolerance = cur.base.preserveExistingAlpha ? 0 : 48;
      cur.manualEraseSeeds = [];
      cur.manualRestorePoints = [];
      document.getElementById('toleranceSlider').value = String(cur.tolerance);
      document.getElementById('toleranceValueText').textContent = String(cur.tolerance);
      recomputeMaskFromTolerance(cur);
      renderEntryToEditorCanvas(cur);
    });

    (function () {
      var canvas = document.getElementById('tagEditorCanvas');
      var paintingRestore = false;
      var lastPt = null;

      function getCanvasPixelCoords(e) {
        var rect = canvas.getBoundingClientRect();
        if (!rect.width || !rect.height) return null;
        var scale = Math.min(rect.width / canvas.width, rect.height / canvas.height);
        var renderedW = canvas.width * scale;
        var renderedH = canvas.height * scale;
        var offsetX = (rect.width - renderedW) / 2;
        var offsetY = (rect.height - renderedH) / 2;
        var x = (e.clientX - rect.left - offsetX) / scale;
        var y = (e.clientY - rect.top - offsetY) / scale;
        if (x < 0 || x >= canvas.width || y < 0 || y >= canvas.height) return null;
        return { x: x, y: y };
      }

      canvas.addEventListener('pointerdown', function (e) {
        var cur = taggingQueue[queueIndex];
        if (!cur || !cur.base) return;
        var pt = getCanvasPixelCoords(e);
        if (!pt) return;

        if (editorToolMode === 'erase') {
          floodEraseAt(cur, pt.x, pt.y, true);
          renderEntryToEditorCanvas(cur);
        } else {
          paintingRestore = true;
          lastPt = pt;
          canvas.setPointerCapture(e.pointerId);
          paintRestoreAt(cur, pt.x, pt.y, true);
          renderEntryToEditorCanvas(cur);
        }
      });

      canvas.addEventListener('pointermove', function (e) {
        if (!paintingRestore || editorToolMode !== 'restore') return;
        var cur = taggingQueue[queueIndex];
        if (!cur || !cur.base) return;
        var pt = getCanvasPixelCoords(e);
        if (!pt) return;
        if (lastPt) {
          paintRestoreLine(cur, lastPt.x, lastPt.y, pt.x, pt.y);
        } else {
          paintRestoreAt(cur, pt.x, pt.y, true);
        }
        lastPt = pt;
        renderEntryToEditorCanvas(cur);
      });

      function stopPaint() { paintingRestore = false; lastPt = null; }
      canvas.addEventListener('pointerup', stopPaint);
      canvas.addEventListener('pointercancel', stopPaint);
    })();

    function updateTaggingUI() {
      var cur = taggingQueue[queueIndex];
      if (!cur) return;
      var isEditingExisting = Boolean(cur.existingItem);

      document.getElementById('tagProgressText').textContent = isEditingExisting
        ? 'Editar peça'
        : ('Foto ' + (queueIndex + 1) + ' de ' + taggingQueue.length);

      document.getElementById('tagProgressTrack').classList.toggle('hidden', isEditingExisting);
      document.getElementById('tagProgressBar').style.width = (((queueIndex + 1) / taggingQueue.length) * 100) + '%';
      document.getElementById('skipPhotoBtn').classList.toggle('hidden', isEditingExisting);
      document.getElementById('cancelQueueBtn').textContent = isEditingExisting ? 'Cancel·lar' : 'Cancel·lar tot';

      document.getElementById('bgRemoveBadge').classList.toggle('hidden', !cur.processing);
      document.getElementById('toleranceSlider').value = String(cur.tolerance);
      document.getElementById('toleranceValueText').textContent = String(cur.tolerance);
      updateEditorToolUI();

      if (cur.base) {
        renderEntryToEditorCanvas(cur);
      } else {
        var c = document.getElementById('tagEditorCanvas');
        c.getContext('2d').clearRect(0, 0, c.width, c.height);
      }

      document.querySelectorAll('.tag-cat-btn').forEach(function (b) {
        var sel = cur.category === b.dataset.cat;
        b.classList.toggle('bg-slate-900', sel); b.classList.toggle('text-white', sel);
      });
      document.querySelectorAll('.tag-form-btn').forEach(function (b) {
        var sel = cur.formalities.indexOf(b.dataset.form) !== -1;
        b.classList.toggle('bg-slate-900', sel); b.classList.toggle('text-white', sel);
      });

      var saveBtn = document.getElementById('saveTagBtn');
      saveBtn.disabled = !cur.category || cur.formalities.length === 0 || cur.processing || !cur.base;
      saveBtn.textContent = isEditingExisting
        ? 'Desar canvis'
        : (queueIndex === taggingQueue.length - 1 ? 'Desar i acabar' : 'Desar i següent');
    }

    function nextInQueue() {
      if (queueIndex + 1 < taggingQueue.length) {
        queueIndex++;
        editorToolMode = 'erase';
        updateTaggingUI();
      } else {
        taggingQueue = []; queueIndex = 0;
        document.getElementById('taggingModal').classList.add('hidden');
        renderAll();
        if (!document.getElementById('closetModal').classList.contains('hidden')) {
          renderClosetModal();
        }
        if (!document.getElementById('laundryModal').classList.contains('hidden')) {
          renderLaundryModal();
        }
      }
    }

    function openCutoutEditorForExistingItem(item) {
      if (!item) return;
      var hasRaw = Boolean(item.rawImage);
      var savedState = item.cutoutState || {};
      var initTol = hasRaw ? (typeof savedState.tolerance === 'number' ? savedState.tolerance : 48) : 0;

      taggingQueue = [{
        id: item.id,
        existingItem: item,
        base: null,
        tolerance: initTol,
        manualEraseSeeds: hasRaw && savedState.manualEraseSeeds ? savedState.manualEraseSeeds.map(function (s) { return { x: s.x, y: s.y }; }) : [],
        manualRestorePoints: hasRaw && savedState.manualRestorePoints ? savedState.manualRestorePoints.map(function (p) { return { x: p.x, y: p.y }; }) : [],
        processing: true,
        category: item.category,
        formalities: item.formalities.slice()
      }];
      queueIndex = 0;
      editorToolMode = 'erase';
      document.getElementById('carouselModal').classList.add('hidden');
      document.getElementById('taggingModal').classList.remove('hidden');
      updateTaggingUI();

      loadImageFromDataUrl(hasRaw ? item.rawImage : item.image, !hasRaw).then(function (baseData) {
        var entry = taggingQueue[0];
        if (!entry) return;
        entry.base = baseData;
        if (baseData) recomputeMaskFromTolerance(entry);
        entry.processing = false;
        updateTaggingUI();
      });
    }

    function randomizeIndices() {
      ['top', 'pants', 'shoes'].forEach(function (cat) {
        if (lockedSlots[cat]) return;
        var list = getCleanItemsFor(cat);
        if (list.length > 0) currentIndices[cat] = Math.floor(Math.random() * list.length);
      });
    }

    document.querySelectorAll('.welcome-pick-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        currentFormality = btn.dataset.pick;
        currentIndices = { top: 0, pants: 0, shoes: 0 };
        lockedSlots = { top: false, pants: false, shoes: false };
        duckEasterEggActive = false;
        randomizeIndices();
        renderAll();
        var overlay = document.getElementById('welcomeOverlay');
        overlay.style.opacity = '0';
        setTimeout(function () { overlay.classList.add('hidden'); }, 300);
      });
    });

    document.querySelectorAll('.formality-btn').forEach(function (b) {
      b.addEventListener('click', function () {
        currentFormality = b.dataset.formality;
        currentIndices = { top: 0, pants: 0, shoes: 0 };
        lockedSlots = { top: false, pants: false, shoes: false };
        duckEasterEggActive = false;
        renderAll();
      });
    });
    ['top', 'pants', 'shoes'].forEach(attachSwipe);

    document.getElementById('shuffleBtn').addEventListener('click', function () {
      if (duckEasterEggActive) {
        duckEasterEggActive = false;
        renderAll();
        return;
      }

      var changedAny = false;
      ['top', 'pants', 'shoes'].forEach(function (cat) {
        if (lockedSlots[cat]) return;
        var list = getCleanItemsFor(cat);
        if (list.length > 1) {
          currentIndices[cat] = (currentIndices[cat] + 1 + Math.floor(Math.random() * (list.length - 1))) % list.length;
          changedAny = true;
        }
      });

      if (changedAny && Math.random() < 0.01) {
        duckEasterEggActive = true;
      }
      renderAll();
    });

    var fileInput = document.getElementById('fileInput');
    document.getElementById('addInsideClosetBtn').addEventListener('click', function () {
      fileInput.value = '';
      fileInput.click();
    });

    fileInput.addEventListener('change', function (e) {
      var files = Array.prototype.slice.call(e.target.files || []);
      if (!files.length) return;
      taggingQueue = files.map(function (f, i) {
        return {
          id: 'item-' + Date.now() + '-' + i,
          file: f,
          base: null,
          tolerance: 48,
          manualEraseSeeds: [],
          manualRestorePoints: [],
          processing: true,
          category: null,
          formalities: []
        };
      });
      queueIndex = 0;
      editorToolMode = 'erase';
      document.getElementById('taggingModal').classList.remove('hidden');
      updateTaggingUI();

      taggingQueue.forEach(function (entry, idx) {
        loadImageForEntry(entry.file).then(function (baseData) {
          entry.base = baseData;
          if (baseData) recomputeMaskFromTolerance(entry);
          entry.processing = false;
          if (queueIndex === idx) updateTaggingUI();
        });
      });
    });

    document.querySelectorAll('.tag-cat-btn').forEach(function (b) {
      b.addEventListener('click', function () {
        var cur = taggingQueue[queueIndex];
        cur.category = cur.category === b.dataset.cat ? null : b.dataset.cat;
        updateTaggingUI();
      });
    });
    document.querySelectorAll('.tag-form-btn').forEach(function (b) {
      b.addEventListener('click', function () {
        var cur = taggingQueue[queueIndex], f = b.dataset.form, idx = cur.formalities.indexOf(f);
        if (idx !== -1) cur.formalities.splice(idx, 1); else cur.formalities.push(f);
        updateTaggingUI();
      });
    });
    document.getElementById('saveTagBtn').addEventListener('click', function () {
      var cur = taggingQueue[queueIndex];
      var finalCutout = exportCroppedCutoutDataUrl(cur);
      if (!finalCutout) { nextInQueue(); return; }

      var cutoutState = {
        tolerance: cur.tolerance,
        manualEraseSeeds: cur.manualEraseSeeds.slice(),
        manualRestorePoints: cur.manualRestorePoints.slice()
      };

      if (cur.existingItem) {
        var existing = cur.existingItem;
        existing.category = cur.category;
        existing.formalities = cur.formalities.slice();
        existing.image = finalCutout;
        if (!existing.rawImage && cur.base && cur.base.rawDataUrl) {
          existing.rawImage = cur.base.rawDataUrl;
        }
        existing.cutoutState = cutoutState;
        putItem(existing).then(function () {
          showToast('Canvis desats');
          nextInQueue();
        });
        return;
      }

      var item = {
        id: cur.id,
        category: cur.category,
        formalities: cur.formalities.slice(),
        image: finalCutout,
        rawImage: cur.base ? cur.base.rawDataUrl : null,
        cutoutState: cutoutState,
        dirty: false,
        isStarter: false
      };
      putItem(item).then(function () { wardrobe.push(item); nextInQueue(); });
    });
    document.getElementById('skipPhotoBtn').addEventListener('click', nextInQueue);
    document.getElementById('cancelQueueBtn').addEventListener('click', function () {
      taggingQueue = [];
      document.getElementById('taggingModal').classList.add('hidden');
      renderAll();

    // --- VISOR / CARRUSEL AMB ACCIONS INDIVIDUALS ---
    function renderCarousel() {
      if (!carouselItems.length) {
        document.getElementById('carouselModal').classList.add('hidden');
        return;
      }
      if (carouselIndex >= carouselItems.length) carouselIndex = carouselItems.length - 1;
      if (carouselIndex < 0) carouselIndex = 0;

      var item = carouselItems[carouselIndex];
      var total = carouselItems.length;

      document.getElementById('carouselCounter').textContent = (carouselIndex + 1) + ' / ' + total;
      document.getElementById('carouselImg').src = item.image;
      document.getElementById('carouselDirtyBadge').classList.toggle('hidden', !item.dirty);

      var itemLaundryBtn = document.getElementById('carouselItemLaundryBtn');
      itemLaundryBtn.textContent = item.dirty ? 'Treure rentadora' : 'A la rentadora';

      var prevBtn = document.getElementById('carouselPrevBtn');
      var nextBtn = document.getElementById('carouselNextBtn');
      prevBtn.classList.toggle('hidden', total <= 1);
      nextBtn.classList.toggle('hidden', total <= 1);

      var dotsEl = document.getElementById('carouselDots');
      if (total <= 1) {
        dotsEl.innerHTML = '';
      } else {
        dotsEl.innerHTML = carouselItems.map(function (_, idx) {
          var active = idx === carouselIndex;
          return '<span class="h-1.5 rounded-full transition-all ' + (active ? 'w-4 bg-slate-900' : 'w-1.5 bg-slate-300') + '"></span>';
        }).join('');
      }
    }

    function openCarousel(items) {
      if (!items || !items.length) return;
      carouselItems = items.slice();
      carouselIndex = 0;
      renderCarousel();
      document.getElementById('carouselModal').classList.remove('hidden');
    }

    document.getElementById('closeCarouselBtn').addEventListener('click', function () {
      document.getElementById('carouselModal').classList.add('hidden');
    });
    document.getElementById('carouselPrevBtn').addEventListener('click', function () {
      carouselIndex = (carouselIndex - 1 + carouselItems.length) % carouselItems.length;
      renderCarousel();
    });
    document.getElementById('carouselNextBtn').addEventListener('click', function () {
      carouselIndex = (carouselIndex + 1) % carouselItems.length;
      renderCarousel();
    });

    document.getElementById('carouselItemEditCutoutBtn').addEventListener('click', function () {
      var item = carouselItems[carouselIndex];
      if (!item) return;
      openCutoutEditorForExistingItem(item);
    });

    document.getElementById('carouselItemLaundryBtn').addEventListener('click', function () {
      var item = carouselItems[carouselIndex];
      if (!item) return;
      item.dirty = !item.dirty;
      putItem(item).then(function () {
        renderCarousel();
        if (!document.getElementById('closetModal').classList.contains('hidden')) renderClosetModal();
        if (!document.getElementById('laundryModal').classList.contains('hidden')) renderLaundryModal();
        renderAll();
        showToast(item.dirty ? 'Enviat a la rentadora' : 'Tret de la rentadora');
      });
    });

    document.getElementById('carouselItemDeleteBtn').addEventListener('click', function () {
      var item = carouselItems[carouselIndex];
      if (!item) return;
      deleteItemFromDB(item.id).then(function () {
        wardrobe = wardrobe.filter(function (w) { return w.id !== item.id; });
        closetSelectedIds = closetSelectedIds.filter(function (id) { return id !== item.id; });
        laundrySelectedIds = laundrySelectedIds.filter(function (id) { return id !== item.id; });
        carouselItems.splice(carouselIndex, 1);

        if (!document.getElementById('closetModal').classList.contains('hidden')) renderClosetModal();
        if (!document.getElementById('laundryModal').classList.contains('hidden')) renderLaundryModal();

        renderCarousel();

    (function () {
      var stage = document.getElementById('carouselStage');
      var sx = 0, dx = 0, down = false;
      stage.addEventListener('pointerdown', function (e) {
        if (e.target.tagName === 'BUTTON') return;
        sx = e.clientX; dx = 0; down = true;
      });
      stage.addEventListener('pointermove', function (e) {
        if (!down) return;
        dx = e.clientX - sx;
      });
      stage.addEventListener('pointerup', function () {
        if (!down) return;
        down = false;
        if (carouselItems.length <= 1) return;
        if (dx < -45) {
          carouselIndex = (carouselIndex + 1) % carouselItems.length;
          renderCarousel();
        } else if (dx > 45) {
          carouselIndex = (carouselIndex - 1 + carouselItems.length) % carouselItems.length;
          renderCarousel();
        }
      });
      stage.addEventListener('pointercancel', function () { down = false; });
    })();

    // --- RENTADORA ---
    function toggleLaundrySelection(id) {
      var idx = laundrySelectedIds.indexOf(id);
      if (idx !== -1) laundrySelectedIds.splice(idx, 1);
      else laundrySelectedIds.push(id);
      renderLaundryModal();
    }

    function renderLaundryModal() {
      var dirty = wardrobe.filter(function (i) { return !i.isStarter && i.dirty; });
      laundrySelectedIds = laundrySelectedIds.filter(function (id) {
        return dirty.some(function (d) { return d.id === id; });
      });

      var hasSelection = laundrySelectedIds.length > 0;
      var allSelected = dirty.length > 0 && laundrySelectedIds.length === dirty.length;
      var grid = document.getElementById('laundryGrid');
      var titleEl = document.getElementById('laundryTitle');
      var editDaysBtn = document.getElementById('editLaundryDaysBtn');
      var selectAllBtn = document.getElementById('selectAllLaundryBtn');
      var cancelBtn = document.getElementById('cancelLaundrySelectBtn');
      var closeBtn = document.getElementById('closeLaundryBtn');
      var normalFooter = document.getElementById('laundryNormalFooter');
      var multiFooter = document.getElementById('laundryMultiFooter');

      if (hasSelection) {
        titleEl.textContent = laundrySelectedIds.length + ' seleccionades';
        editDaysBtn.classList.add('hidden');
        selectAllBtn.classList.toggle('hidden', allSelected);
        cancelBtn.classList.remove('hidden');
        closeBtn.classList.add('hidden');
        normalFooter.classList.add('hidden');
        multiFooter.classList.remove('hidden');
      } else {
        titleEl.textContent = 'Rentadora';
        editDaysBtn.classList.remove('hidden');
        selectAllBtn.classList.add('hidden');
        cancelBtn.classList.add('hidden');
        closeBtn.classList.remove('hidden');
        normalFooter.classList.remove('hidden');
        multiFooter.classList.add('hidden');
        document.getElementById('washAllBtn').disabled = dirty.length === 0;
      }

      grid.innerHTML = dirty.length ? dirty.map(function (i) {
        var isSelected = laundrySelectedIds.indexOf(i.id) !== -1;
        var ringClass = isSelected ? 'ring-2 ring-sky-600 bg-sky-50' : 'bg-slate-100';
        var checkBadge = isSelected
          ? '<span class="absolute top-1.5 right-1.5 w-5 h-5 rounded-full bg-sky-600 text-white flex items-center justify-center text-[11px] font-bold">&#10003;</span>'
          : '';
        return '<button type="button" data-id="' + i.id + '" class="laundry-item-btn aspect-square rounded-2xl ' + ringClass + ' p-2 flex items-center justify-center relative active:scale-95 transition"><img src="' + i.image + '" class="w-full h-full object-contain pointer-events-none"/>' + checkBadge + '</button>';
      }).join('') : '<div class="col-span-3 text-center text-xs text-slate-400 py-10">La rentadora és buida</div>';

      grid.querySelectorAll('.laundry-item-btn').forEach(function (b) {
        b.addEventListener('click', function () {
          toggleLaundrySelection(b.dataset.id);
        });
      });
    }

    document.getElementById('selectAllLaundryBtn').addEventListener('click', function () {
      var dirty = wardrobe.filter(function (i) { return !i.isStarter && i.dirty; });
      laundrySelectedIds = dirty.map(function (i) { return i.id; });
      renderLaundryModal();
    });

    document.getElementById('cancelLaundrySelectBtn').addEventListener('click', function () {
      laundrySelectedIds = [];
      renderLaundryModal();
    });

    document.getElementById('laundryViewSelectedBtn').addEventListener('click', function () {
      var selectedItems = laundrySelectedIds.map(function (id) {
        return wardrobe.find(function (w) { return w.id === id; });
      }).filter(Boolean);
      openCarousel(selectedItems);
    });

    document.getElementById('washSelectedBtn').addEventListener('click', function () {
      var targets = wardrobe.filter(function (i) { return laundrySelectedIds.indexOf(i.id) !== -1; });
      Promise.all(targets.map(function (i) { i.dirty = false; return putItem(i); })).then(function () {
        renderLaundryModal();
        renderAll();
        showToast('Roba neta');
      });
    });

    document.getElementById('laundryBtn').addEventListener('click', function () {
      laundrySelectedIds = [];
      renderLaundryModal();
      document.getElementById('laundryModal').classList.remove('hidden');
    });
    document.getElementById('closeLaundryBtn').addEventListener('click', function () {
      laundrySelectedIds = [];
      document.getElementById('laundryModal').classList.add('hidden');
    });
    document.getElementById('washAllBtn').addEventListener('click', function () {
      washAllDirtyItems().then(function () {
        document.getElementById('laundryModal').classList.add('hidden');
      });
    });

    // --- ARMARI AMB FILTRES ---
    function getFilteredClosetItems() {
      var real = wardrobe.filter(function (i) { return !i.isStarter; });
      if (closetCategoryFilter === 'all') return real;
      return real.filter(function (i) { return i.category === closetCategoryFilter; });
    }

    function toggleClosetSelection(id) {
      var idx = closetSelectedIds.indexOf(id);
      if (idx !== -1) closetSelectedIds.splice(idx, 1);
      else closetSelectedIds.push(id);
      renderClosetModal();
    }

    function renderClosetModal() {
      document.querySelectorAll('.closet-filter-btn').forEach(function (btn) {
        var active = btn.dataset.filter === closetCategoryFilter;
        btn.classList.toggle('bg-white', active);
        btn.classList.toggle('text-slate-900', active);
        btn.classList.toggle('shadow-sm', active);
        btn.classList.toggle('text-slate-500', !active);
      });

      var visibleItems = getFilteredClosetItems();
      closetSelectedIds = closetSelectedIds.filter(function (id) {
        return visibleItems.some(function (r) { return r.id === id; });
      });

      var selectedItems = closetSelectedIds.map(function (id) {
        return visibleItems.find(function (r) { return r.id === id; });
      }).filter(Boolean);

      var hasSelection = selectedItems.length > 0;
      var allSelected = visibleItems.length > 0 && selectedItems.length === visibleItems.length;
      var grid = document.getElementById('closetGrid');
      var titleEl = document.getElementById('closetTitle');
      var addBtn = document.getElementById('addInsideClosetBtn');
      var selectAllBtn = document.getElementById('selectAllClosetBtn');
      var cancelBtn = document.getElementById('cancelClosetSelectBtn');
      var closeBtn = document.getElementById('closeClosetBtn');
      var multiFooter = document.getElementById('closetMultiFooter');
      var toggleLaundryBtn = document.getElementById('closetToggleLaundryBtn');

      if (hasSelection) {
        titleEl.textContent = selectedItems.length + ' seleccionades';
        addBtn.classList.add('hidden');
        closeBtn.classList.add('hidden');
        selectAllBtn.classList.toggle('hidden', allSelected);
        cancelBtn.classList.remove('hidden');
        multiFooter.classList.remove('hidden');

        var allDirty = selectedItems.every(function (i) { return i.dirty; });
        toggleLaundryBtn.textContent = allDirty ? 'Treure rentadora' : 'A la rentadora';
      } else {
        titleEl.textContent = 'Armari';
        addBtn.classList.remove('hidden');
        closeBtn.classList.remove('hidden');
        selectAllBtn.classList.add('hidden');
        cancelBtn.classList.add('hidden');
        multiFooter.classList.add('hidden');
      }

      var emptyMsg = closetCategoryFilter === 'all'
        ? 'Encara no hi ha roba a l\'armari'
        : 'Cap peça en aquesta categoria';

      grid.innerHTML = visibleItems.length ? visibleItems.map(function (i) {
        var isSelected = closetSelectedIds.indexOf(i.id) !== -1;
        var ringClass = isSelected ? 'ring-2 ring-sky-600 bg-sky-50' : 'bg-slate-100';
        var dirtyDot = i.dirty ? '<span class="absolute bottom-1.5 right-1.5 w-2.5 h-2.5 rounded-full bg-sky-500"></span>' : '';
        var checkBadge = isSelected
          ? '<span class="absolute top-1.5 right-1.5 w-5 h-5 rounded-full bg-sky-600 text-white flex items-center justify-center text-[11px] font-bold">&#10003;</span>'
          : '';
        return '<button type="button" data-id="' + i.id + '" class="closet-item-btn aspect-square rounded-2xl ' + ringClass + ' p-2 flex items-center justify-center relative active:scale-95 transition"><img src="' + i.image + '" class="w-full h-full object-contain pointer-events-none"/>' + dirtyDot + checkBadge + '</button>';
      }).join('') : '<div class="col-span-3 text-center text-xs text-slate-400 py-10">' + emptyMsg + '</div>';

      grid.querySelectorAll('.closet-item-btn').forEach(function (b) {
        b.addEventListener('click', function () {
          toggleClosetSelection(b.dataset.id);
        });
      });
    }

    document.querySelectorAll('.closet-filter-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        closetCategoryFilter = btn.dataset.filter;
        closetSelectedIds = [];
        renderClosetModal();
      });
    });

    document.getElementById('selectAllClosetBtn').addEventListener('click', function () {
      var visibleItems = getFilteredClosetItems();
      closetSelectedIds = visibleItems.map(function (i) { return i.id; });
      renderClosetModal();
    });

    document.getElementById('cancelClosetSelectBtn').addEventListener('click', function () {
      closetSelectedIds = [];
      renderClosetModal();
    });

    document.getElementById('closetViewSelectedBtn').addEventListener('click', function () {
      var selectedItems = closetSelectedIds.map(function (id) {
        return wardrobe.find(function (w) { return w.id === id; });
      }).filter(Boolean);
      openCarousel(selectedItems);
    });

    document.getElementById('closetToggleLaundryBtn').addEventListener('click', function () {
      var targets = wardrobe.filter(function (i) { return closetSelectedIds.indexOf(i.id) !== -1; });
      if (!targets.length) return;
      var allDirty = targets.every(function (i) { return i.dirty; });
      var nextDirtyState = !allDirty;

      Promise.all(targets.map(function (i) {
        i.dirty = nextDirtyState;
        return putItem(i);
      })).then(function () {
        renderClosetModal();
        renderAll();
        showToast(nextDirtyState ? 'Enviat a la rentadora' : 'Tret de la rentadora');
      });
    });

    document.getElementById('closetDeleteSelectedBtn').addEventListener('click', function () {
      var idsToRemove = closetSelectedIds.slice();
      Promise.all(idsToRemove.map(function (id) { return deleteItemFromDB(id); })).then(function () {
        wardrobe = wardrobe.filter(function (w) { return idsToRemove.indexOf(w.id) === -1; });
        closetSelectedIds = [];
        renderClosetModal();
        renderAll();
      });
    });

    document.getElementById('closetBtn').addEventListener('click', function () {
      closetCategoryFilter = 'all';
      closetSelectedIds = [];
      renderClosetModal();
      document.getElementById('closetModal').classList.remove('hidden');
    });
    document.getElementById('closeClosetBtn').addEventListener('click', function () {
      closetSelectedIds = [];
      document.getElementById('closetModal').classList.add('hidden');
    });

    getAllItems().then(function (saved) {
      wardrobe = STARTER_ITEMS.concat(saved);
      renderAll();
      checkLaundrySchedule();
    }).catch(function () {
      wardrobe = STARTER_ITEMS.slice();
      renderAll();
      checkLaundrySchedule();
    });

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').then(function (reg) {
        reg.update().catch(function () {});
      }).catch(function () {});
    }
  </script>
</body>
</html>
